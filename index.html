<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Antoine Baesen — Projets</title>
  <meta name="description" content="Les projets et univers d’Antoine Baesen.">
  <style>
    :root{color-scheme:light;font-family:system-ui,sans-serif;color:#243b3e;background:#f5f1e7}*{box-sizing:border-box}body{margin:0}main{max-width:960px;margin:auto;padding:clamp(40px,10vw,110px) 24px}.eyebrow{font-size:11px;letter-spacing:3px;color:#8c7544}h1{font:normal clamp(42px,8vw,72px)/1.1 Georgia,serif;margin:20px 0}header>p{line-height:1.8;color:#66726b}#projects{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:24px;margin-top:48px}.project{display:flex;flex-direction:column;align-items:start;gap:16px;padding:30px;border:1px solid #d5cbb4;border-radius:6px;background:#fffaf0;color:inherit;text-decoration:none;transition:transform .15s,box-shadow .15s}.project:hover{transform:translateY(-3px);box-shadow:0 8px 24px #243b3e12}.project:focus-visible{outline:3px solid #a38446;outline-offset:4px}.project h2{font:normal 30px Georgia,serif;margin:0}.project p{font-size:14px;line-height:1.8;margin:0;color:#66726b}.project span{margin-top:auto;color:#866c3e;font-size:13px;padding-top:10px}footer{font-size:12px;color:#7c806f;margin-top:60px}
  </style>
</head>
<body>
  <main>
    <header><div class="eyebrow">ANTOINE BAESEN</div><h1>Projets & univers</h1><p>Des mondes à explorer, des histoires à découvrir.</p></header>
    <section id="projects" aria-label="Mes projets"><a class="project" href="./askallor-wiki/"><h2>Wiki Askallor</h2><p>Atlas, chronologie et généalogies des Chroniques de l’Empire.</p><span>Explorer le projet →</span></a></section>
    <footer>Antoine Baesen</footer>
  </main>
  <script>
    // Folders provide the routing; this list is only the projects' home page.
    fetch('./projects.json').then(r=>{if(!r.ok)throw new Error();return r.json();}).then(projects=>{
      if(!Array.isArray(projects))return;
      const cards=projects.filter(p=>typeof p.name==='string'&&typeof p.path==='string'&&/^\.\/[a-z0-9][a-z0-9/_-]*\/$/i.test(p.path)&&!p.path.includes('..')).map(p=>{
        const a=document.createElement('a');a.className='project';a.href=p.path;
        const h=document.createElement('h2');h.textContent=p.name;
        const description=document.createElement('p');description.textContent=p.description||'';
        const label=document.createElement('span');label.textContent='Explorer le projet →';
        a.append(h,description,label);return a;
      });
      if(cards.length)document.getElementById('projects').replaceChildren(...cards);
    }).catch(()=>{});
  </script>
</body>
</html>
